[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indistat"
version = "0.1.0"
description = "IndiStat: Open Source Library of Quantitative Indicators for Technical Dept., Finance Society, NITJ"
readme = "README.md"
authors = [
    { name = "Kartik Sirohi", email = "99896785+sirohikartik@users.noreply.github.com" }
]
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2.38",
    "pandas>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]
